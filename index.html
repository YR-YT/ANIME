<!DOCTYPE html> 
<html lang="en"> 
<head>   
  <meta charset="UTF-8">   
  <meta name="viewport" content="width=device-width, initial-scale=1.0">   
  <title>Monarch Anime | Premium Viewer</title>   
  <script src="https://cdn.tailwindcss.com"></script>   
  <script>     
    tailwind.config = {       
      theme: { extend: { colors: { brand: { 400: '#a78bfa', 500: '#8b5cf6' }, dark: '#09090b', surface: '#18181b' } } }     
    }   
  </script>   
  <style>     
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');     
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #f4f4f5; }         
  </style> 
</head> 
<body class="antialiased min-h-screen flex flex-col">   
  <nav class="fixed w-full z-50 bg-dark/90 backdrop-blur-xl border-b border-white/5 p-4">     
    <div class="flex justify-between items-center max-w-[1200px] mx-auto">              
      <div class="text-2xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-500 cursor-pointer" onclick="document.getElementById('watchView').classList.add('hidden'); document.getElementById('homeView').classList.remove('hidden');">MONARCH ANIME</div>         
      <div class="flex gap-4">
        <!-- Login Modal Trigger -->
        <button class="text-sm font-bold text-gray-300 hover:text-white" onclick="document.getElementById('loginModal').classList.remove('hidden')">Log In</button>
      </div>
    </div>   
  </nav>   

  <!-- PUDHU LOGIN MODAL DESIGN -->
  <div id="loginModal" class="hidden fixed inset-0 z-[100] bg-black/80 flex items-center justify-center">
    <div class="bg-surface p-8 rounded-2xl border border-white/10 w-full max-w-md mx-4">
      <h2 class="text-2xl font-bold text-white mb-6 text-center">Login to Monarch</h2>
      <input id="emailInput" type="email" placeholder="Email Address" class="w-full mb-4 p-3 rounded bg-dark border border-gray-600 text-white focus:outline-none focus:border-brand-500 transition-colors">
      <input id="passwordInput" type="password" placeholder="Password" class="w-full mb-6 p-3 rounded bg-dark border border-gray-600 text-white focus:outline-none focus:border-brand-500 transition-colors">
      <button id="submitLoginBtn" class="w-full bg-brand-500 text-white p-3 rounded-lg font-bold hover:bg-brand-400 mb-4 transition-colors">Log In</button>
      <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="w-full text-gray-400 hover:text-white text-sm transition-colors">Cancel</button>
    </div>
  </div>

  <!-- HOME VIEW -->   
  <div id="homeView" class="flex-1 flex flex-col pt-20">     
    <div class="relative w-full h-[60vh] flex items-center justify-center bg-surface">       
      <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('https://placehold.co/1920x1080/18181b/a78bfa?text=Monarch+Anime');"></div>              
      <div class="relative z-10 text-center px-6">         
        <h1 id="heroTitle" class="text-5xl font-black text-white mb-4">Waiting for Admin...</h1>         
        <p id="heroSynopsis" class="text-gray-400 text-lg mb-8 max-w-2xl mx-auto">Upload an anime from the Admin Dashboard to see it appear here dynamically.</p>                 
        <button onclick="document.getElementById('homeView').classList.add('hidden'); document.getElementById('watchView').classList.remove('hidden');" class="bg-white text-dark px-8 py-3 rounded-full font-bold hover:scale-105 transition-transform">             
          Watch Now            
        </button>         
      </div>     
    </div>     
    
    <div class="px-6 py-10 max-w-[1200px] mx-auto w-full">       
      <h2 class="text-2xl font-bold text-white mb-6">Latest from Admin</h2>        
      <div id="dynamicGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">         
        <div class="text-gray-500 text-sm">No videos uploaded yet.</div>
      </div>     
    </div>   
  </div>   

  <!-- WATCH VIEW -->   
  <div id="watchView" class="hidden flex-1 flex-col pt-24 px-6 pb-10 max-w-[1200px] mx-auto w-full">     
    <button onclick="document.getElementById('watchView').classList.add('hidden'); document.getElementById('homeView').classList.remove('hidden');" class="mb-6 text-sm font-bold text-gray-400 hover:text-white">&larr; Back to Home</button>          
    
    <div class="bg-black aspect-video rounded-2xl shadow-2xl flex items-center justify-center relative overflow-hidden">            
      <video id="mainVideo" controls class="w-full h-full object-cover" poster="https://placehold.co/1920x1080/18181b/a78bfa?text=Video+Player">             
        <source id="videoSource" src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">            
      </video>         
    </div>                  
    
    <div class="mt-6 bg-surface p-5 rounded-2xl border border-white/5">            
      <h2 id="watchTitle" class="text-2xl font-black text-white mb-2">Loading Title...</h2>              
      <p id="watchDesc" class="text-gray-400 text-sm">Loading description...</p>
      <div id="aiTagsContainer" class="mt-4 flex gap-2 flex-wrap"></div>        
    </div>         
  </div>   

  <script type="module">     
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";     
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";     
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"; 
    
    // REAL FIREBASE CONFIGURATION UPDATED HERE
    const firebaseConfig = {
      apiKey: "AIzaSyDQ9SlXC5o4cCd1ayuHcUOobC1SfQddauM",
      authDomain: "monarch-anime.firebaseapp.com",
      projectId: "monarch-anime",
      storageBucket: "monarch-anime.firebasestorage.app",
      messagingSenderId: "869435240493",
      appId: "1:869435240493:web:628b8a1273723644b608a4",
      measurementId: "G-9DVT7VV478"
    };
    
    const app = initializeApp(firebaseConfig);     
    const db = getFirestore(app);   
    const auth = getAuth(app);  
    const adminAppId = 'monarch-anime-admin'; 

    // FIREBASE LOGIN SCRIPT
    document.getElementById('submitLoginBtn').addEventListener('click', () => {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      
      if(!email || !password) {
        alert("Please enter both email and password!");
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Success! Logged in as " + userCredential.user.email);
          document.getElementById('loginModal').classList.add('hidden');
        })
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    });

    async function fetchLatestUpload() {       
      try {         
        const animesRef = collection(db, 'artifacts', adminAppId, 'public', 'data', 'animes');         
        const snapshot = await getDocs(animesRef);         
        const animesList = snapshot.docs.map(d => ({id: d.id, ...d.data()}));         
        
        if (animesList.length > 0) {
            animesList.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
            const latestAnime = animesList[0];
            
            document.getElementById('heroTitle').innerText = latestAnime.title;
            document.getElementById('watchTitle').innerText = latestAnime.title;
            document.getElementById('heroSynopsis').innerText = latestAnime.description;
            document.getElementById('watchDesc').innerText = latestAnime.description;
            
            if (latestAnime.tags) {
                const tagsContainer = document.getElementById('aiTagsContainer');
                tagsContainer.innerHTML = '';
                latestAnime.tags.forEach(tag => { 
                    tagsContainer.innerHTML += `<span class="bg-surface border border-white/10 text-brand-400 px-3 py-1 text-xs rounded-full font-bold shadow-md">${tag}</span>`; 
                });
            }

            const gridContainer = document.getElementById('dynamicGrid');
            gridContainer.innerHTML = '';
            animesList.forEach(anime => {
                gridContainer.innerHTML += `
                    <div class="bg-surface rounded-xl overflow-hidden cursor-pointer" onclick="document.getElementById('homeView').classList.add('hidden'); document.getElementById('watchView').classList.remove('hidden'); window.scrollTo(0,0);">
                        <img src="https://placehold.co/400x600/18181b/a78bfa?text=${encodeURIComponent(anime.title)}" class="w-full aspect-[2/3] object-cover">
                        <div class="p-3"><h3 class="text-white font-bold truncate">${anime.title}</h3></div>
                    </div>
                `;
            });
        }       
      } catch (error) { 
        console.log("Waiting for Admin database to initialize...");
      }     
    }     

    // Initial load
    fetchLatestUpload();
    // Auto-refresh data every 5 seconds
    setInterval(fetchLatestUpload, 5000);
  </script>
</body> 
</html>
