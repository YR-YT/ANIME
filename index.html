<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monarch Anime | Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 400: '#a78bfa', 500: '#8b5cf6' },
            dark: '#09090b',
            surface: '#18181b'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #f4f4f5; }
    #theaterBackdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 45; }
    body.theater-on #theaterBackdrop { display: block; }
    body.theater-on #playerSection { position: relative; z-index: 50; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="theaterBackdrop" onclick="toggleTheaterMode()"></div>

  <nav class="fixed w-full z-50 bg-dark/90 backdrop-blur-xl border-b border-white/5 p-4">
    <div class="flex justify-between items-center max-w-[1200px] mx-auto">
      <div class="text-2xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-500 cursor-pointer" onclick="showHomeView()">
        MONARCH ANIME
      </div>

      <div class="flex items-center gap-3 relative">
        <button id="createAccNavBtn" class="text-sm font-bold bg-brand-500 hover:bg-brand-400 text-white px-4 py-1.5 rounded-lg transition-colors" onclick="openAuthModal('signup')">Create Account</button>
        <button id="authActionBtn" class="text-sm font-bold text-gray-300 hover:text-white px-3 py-1.5" onclick="openAuthModal('login')">Log In</button>

        <div id="profileMenuWrap" class="hidden relative">
          <button type="button" id="animalAvatarBtn" onclick="toggleProfileDropdown(event)" class="flex items-center gap-2 rounded-full border border-white/15 bg-surface hover:border-brand-500 p-1 pr-3 transition-colors cursor-pointer">
            <img id="animalAvatarImg" alt="Animal Avatar" class="w-8 h-8 rounded-full object-cover bg-dark">
            <span id="profileDisplayName" class="text-xs font-bold text-white max-w-[120px] truncate"></span>
          </button>

          <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-60 rounded-xl bg-surface border border-white/10 shadow-2xl py-2 z-[120]">
            <div class="px-4 py-2 border-b border-white/10 flex items-center gap-3">
              <img id="dropdownAvatarImg" alt="Animal Avatar" class="w-10 h-10 rounded-full object-cover bg-dark">
              <div class="overflow-hidden">
                <div id="dropdownUserName" class="text-sm font-bold text-white truncate"></div>
                <div id="dropdownAnimalLabel" class="text-[11px] text-brand-400 font-semibold"></div>
              </div>
            </div>

            <button type="button" onclick="openSectionModal('profile')" class="w-full text-left px-4 py-2.5 text-sm text-gray-200 hover:bg-white/5 flex items-center gap-2">
              <span>Profile</span>
            </button>
            <button type="button" onclick="openSectionModal('continue')" class="w-full text-left px-4 py-2.5 text-sm text-gray-200 hover:bg-white/5 flex items-center gap-2">
              <span>Continue Watch</span>
            </button>
            <button type="button" onclick="openSectionModal('new-release')" class="w-full text-left px-4 py-2.5 text-sm text-gray-200 hover:bg-white/5 flex items-center gap-2">
              <span>New Release Anime</span>
            </button>

            <div class="border-t border-white/10 mt-1 pt-1">
              <button type="button" onclick="logoutCurrentUser()" class="w-full text-left px-4 py-2 text-sm font-bold text-rose-400 hover:bg-white/5">
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- AUTH MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 z-[100] bg-black/80 flex items-center justify-center">
    <div class="bg-surface p-8 rounded-2xl border border-white/10 w-full max-w-md mx-4">
      <div class="grid grid-cols-2 gap-2 bg-dark p-1 rounded-xl mb-6 border border-white/10">
        <button type="button" id="tabSignupBtn" onclick="setAuthMode('signup')" class="py-2 rounded-lg text-sm font-bold bg-brand-500 text-white transition-colors">Create Account</button>
        <button type="button" id="tabLoginBtn" onclick="setAuthMode('login')" class="py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-colors">Log In</button>
      </div>

      <h2 id="authModalTitle" class="text-2xl font-bold text-white mb-6 text-center">Create Account</h2>

      <div id="usernameFieldWrap" class="mb-4">
        <input id="usernameInput" type="text" placeholder="Enter your username" class="w-full p-3 rounded bg-dark border border-gray-600 text-white focus:outline-none focus:border-brand-500 transition-colors">
      </div>

      <input id="emailInput" type="email" placeholder="Enter your email address" class="w-full mb-4 p-3 rounded bg-dark border border-gray-600 text-white focus:outline-none focus:border-brand-500 transition-colors">
      <input id="passwordInput" type="password" placeholder="Enter your password" class="w-full mb-6 p-3 rounded bg-dark border border-gray-600 text-white focus:outline-none focus:border-brand-500 transition-colors">

      <button id="submitAuthBtn" class="w-full bg-brand-500 text-white p-3 rounded-lg font-bold hover:bg-brand-400 mb-4 transition-colors">Create Account</button>
      <button type="button" onclick="closeLoginModal()" class="w-full text-gray-400 hover:text-white text-sm transition-colors">Cancel</button>
    </div>
  </div>

  <!-- SECTION MODAL -->
  <div id="userSectionModal" class="hidden fixed inset-0 z-[110] bg-black/80 flex items-center justify-center p-4">
    <div class="bg-surface rounded-2xl border border-white/10 w-full max-w-2xl max-h-[82vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
        <h3 id="sectionModalTitle" class="text-xl font-bold text-white">Profile</h3>
        <button type="button" onclick="closeSectionModal()" class="text-gray-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div id="sectionModalBody" class="p-6 overflow-y-auto space-y-4"></div>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div id="homeView" class="flex-1 flex flex-col pt-20">
    <div class="relative w-full h-[56vh] flex items-center justify-center bg-surface overflow-hidden">
      <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-25"></div>
      <div class="relative z-10 text-center px-6 max-w-3xl">
        <h1 id="heroTitle" class="text-4xl md:text-5xl font-black text-white mb-4">Monarch Anime</h1>
        <p id="heroSynopsis" class="text-gray-400 text-base md:text-lg mb-8">Published public episodes from Firestore will appear here automatically.</p>
        <button id="heroWatchBtn" onclick="watchLatestEpisode()" class="bg-white text-dark px-8 py-3 rounded-full font-bold hover:scale-105 transition-transform">
          Watch Now
        </button>
      </div>
    </div>

    <div class="px-6 py-10 max-w-[1200px] mx-auto w-full">
      <h2 class="text-2xl font-bold text-white mb-6">Published Episodes</h2>
      <div id="dynamicGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="text-gray-500 text-sm col-span-full">No public episodes published yet.</div>
      </div>
    </div>
  </div>

  <!-- WATCH VIEW (MULTI-SERVER & SMART PLAYER) -->
  <div id="watchView" class="hidden flex-1 flex-col pt-24 px-6 pb-10 max-w-[1200px] mx-auto w-full">
    <button onclick="showHomeView()" class="mb-4 text-sm font-bold text-gray-400 hover:text-white self-start">&larr; Back to Home</button>

    <!-- Player Container -->
    <div id="playerSection" class="bg-black aspect-video rounded-2xl shadow-2xl flex items-center justify-center relative overflow-hidden border border-white/10">
      <div id="playerBox" class="w-full h-full"></div>
    </div>

    <!-- AnimeSuge-Style Action Bar -->
    <div class="mt-3 flex flex-wrap items-center justify-between gap-3 bg-surface/60 p-3 rounded-xl border border-white/5 text-xs text-gray-300">
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="autoNextToggle" class="accent-brand-500">
          <span>Auto Next</span>
        </label>
        <button type="button" onclick="toggleTheaterMode()" class="hover:text-white flex items-center gap-1">
          <span id="lightIcon">&#9680;</span> <span id="lightText">Light: Off</span>
        </button>
      </div>

      <!-- Multi-Server Selector -->
      <div class="flex items-center gap-2">
        <span class="text-gray-500 font-bold">SERVER:</span>
        <div id="serverButtonsList" class="flex items-center gap-1.5"></div>
      </div>
    </div>

    <!-- Metadata & Episode Selector -->
    <div class="mt-4 bg-surface p-5 rounded-2xl border border-white/5">
      <div class="text-xs uppercase tracking-wider text-brand-400 font-bold mb-1" id="watchMeta"></div>
      <h2 id="watchTitle" class="text-2xl font-black text-white mb-2">Select an Episode</h2>
      <p id="watchDesc" class="text-gray-400 text-sm">No description available.</p>

      <div class="mt-4 pt-4 border-t border-white/10">
        <div class="text-xs font-bold text-gray-400 mb-2">EPISODES</div>
        <div id="episodeListContainer" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, setDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQ9SlXC5o4cCd1ayuHcUOobC1SfQddauM",
      authDomain: "monarch-anime.firebaseapp.com",
      projectId: "monarch-anime",
      storageBucket: "monarch-anime.firebasestorage.app",
      messagingSenderId: "869435240493",
      appId: "1:869435240493:web:628b8a1273723644b608a4",
      measurementId: "G-9DVT7VV478"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const adminAppId = 'monarch-anime-admin';

    const basePublicPath = ['artifacts', adminAppId, 'public', 'data'];
    const animesRef = collection(db, ...basePublicPath, 'animes');
    const analyticsRef = collection(db, ...basePublicPath, 'analytics');
    const sessionsRef = collection(db, ...basePublicPath, 'sessions');

    let authMode = 'signup';
    let publicEpisodes = [];
    let currentEpisodeIndex = -1;
    let currentEpisode = null;
    let currentUser = null;
    let activeServerIndex = 0;

    function generateAnimalPaperAvatar(seed) {
      const animals = [
        { name: 'Paper Fox', primary: '#f97316', secondary: '#ffedd5', ear: '#ea580c' },
        { name: 'Paper Wolf', primary: '#64748b', secondary: '#f1f5f9', ear: '#475569' },
        { name: 'Paper Owl', primary: '#a855f7', secondary: '#f3e8ff', ear: '#7e22ce' },
        { name: 'Paper Panda', primary: '#e2e8f0', secondary: '#ffffff', ear: '#1e293b' },
        { name: 'Paper Cat', primary: '#f59e0b', secondary: '#fef3c7', ear: '#d97706' }
      ];
      let hash = 0;
      const str = String(seed || 'monarch');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      const chosen = animals[Math.abs(hash) % animals.length];

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
          <defs>
            <filter id="paperShadow" x="-15%" y="-15%" width="130%" height="130%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect width="120" height="120" rx="60" fill="#14141b"/>
          <polygon points="24,52 36,16 54,44" fill="${chosen.ear}" filter="url(#paperShadow)"/>
          <polygon points="96,52 84,16 66,44" fill="${chosen.ear}" filter="url(#paperShadow)"/>
          <polygon points="60,26 96,56 82,96 38,96 24,56" fill="${chosen.primary}" filter="url(#paperShadow)"/>
          <polygon points="60,52 84,72 60,98 36,72" fill="${chosen.secondary}"/>
          <circle cx="46" cy="58" r="5" fill="#09090b"/>
          <circle cx="74" cy="58" r="5" fill="#09090b"/>
          <polygon points="60,67 54,75 66,75" fill="#09090b"/>
        </svg>
      `.trim();

      return {
        animalName: chosen.name,
        dataUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg)
      };
    }

    function getWatchHistoryStorageKey(uid) {
      return `monarch_watch_history_${uid || 'guest'}`;
    }

    function loadWatchHistory(uid) {
      try {
        const raw = localStorage.getItem(getWatchHistoryStorageKey(uid));
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function recordEpisodeWatch(ep) {
      if (!currentUser || !ep) return;
      const list = loadWatchHistory(currentUser.uid).filter(item => item.id !== ep.id);
      list.unshift({
        id: ep.id,
        animeTitle: ep.animeTitle,
        seasonName: ep.seasonName,
        epNumber: ep.epNumber,
        epTitle: ep.epTitle,
        thumbnailUrl: ep.thumbnailUrl || '',
        watchedAt: Date.now()
      });
      localStorage.setItem(getWatchHistoryStorageKey(currentUser.uid), JSON.stringify(list.slice(0, 20)));
    }

    const params = new URLSearchParams(window.location.search);
    const searchQuery = params.get('q') || params.get('search') || '';
    addDoc(analyticsRef, {
      visitedAt: serverTimestamp(),
      userAgent: navigator.userAgent || '',
      language: navigator.language || '',
      referrer: document.referrer || '',
      source: document.referrer ? 'External Referrer' : 'Direct / Vercel Visit',
      searchQuery
    }).catch(() => {});

    window.setAuthMode = function(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      document.getElementById('tabSignupBtn').className = isSignup
        ? 'py-2 rounded-lg text-sm font-bold bg-brand-500 text-white transition-colors'
        : 'py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-colors';
      document.getElementById('tabLoginBtn').className = !isSignup
        ? 'py-2 rounded-lg text-sm font-bold bg-brand-500 text-white transition-colors'
        : 'py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-colors';

      document.getElementById('authModalTitle').textContent = isSignup ? 'Create Account' : 'Login to Monarch';
      document.getElementById('usernameFieldWrap').classList.toggle('hidden', !isSignup);
      document.getElementById('submitAuthBtn').textContent = isSignup ? 'Create Account' : 'Log In';
    };

    window.openAuthModal = function(mode = 'signup') {
      setAuthMode(mode);
      document.getElementById('loginModal').classList.remove('hidden');
    };

    window.closeLoginModal = function() {
      document.getElementById('loginModal').classList.add('hidden');
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const createBtn = document.getElementById('createAccNavBtn');
      const loginBtn = document.getElementById('authActionBtn');
      const profileWrap = document.getElementById('profileMenuWrap');

      if (user) {
        const displayName = user.displayName || 'Member';
        const avatar = generateAnimalPaperAvatar(user.uid || displayName);

        document.getElementById('animalAvatarImg').src = avatar.dataUrl;
        document.getElementById('dropdownAvatarImg').src = avatar.dataUrl;
        document.getElementById('profileDisplayName').textContent = displayName;
        document.getElementById('dropdownUserName').textContent = displayName;
        document.getElementById('dropdownAnimalLabel').textContent = avatar.animalName;

        createBtn.classList.add('hidden');
        loginBtn.classList.add('hidden');
        profileWrap.classList.remove('hidden');
      } else {
        document.getElementById('profileDropdown').classList.add('hidden');
        profileWrap.classList.add('hidden');
        createBtn.classList.remove('hidden');
        loginBtn.classList.remove('hidden');
      }
    });

    window.toggleProfileDropdown = function(event) {
      event.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('hidden');
    };

    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('profileMenuWrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('profileDropdown').classList.add('hidden');
      }
    });

    window.logoutCurrentUser = async function() {
      try {
        await signOut(auth);
      } catch (err) {
        alert("Logout failed: " + err.message);
      }
    };

    window.openSectionModal = function(section) {
      document.getElementById('profileDropdown').classList.add('hidden');
      const modal = document.getElementById('userSectionModal');
      const titleEl = document.getElementById('sectionModalTitle');
      const bodyEl = document.getElementById('sectionModalBody');

      if (section === 'profile') {
        titleEl.textContent = 'Profile';
        const name = currentUser?.displayName || 'Member';
        const avatar = generateAnimalPaperAvatar(currentUser?.uid || name);
        const historyCount = loadWatchHistory(currentUser?.uid).length;
        bodyEl.innerHTML = `
          <div class="flex items-center gap-4 bg-dark p-4 rounded-xl border border-white/10">
            <img src="${escapeAttr(avatar.dataUrl)}" alt="Animal Avatar" class="w-16 h-16 rounded-full object-cover">
            <div>
              <div class="text-lg font-bold text-white">${escapeHtml(name)}</div>
              <div class="text-xs text-brand-400 font-semibold">${escapeHtml(avatar.animalName)}</div>
              <div class="text-xs text-gray-400 mt-1">Episodes Watched: ${historyCount}</div>
            </div>
          </div>
        `;
      } else if (section === 'continue') {
        titleEl.textContent = 'Continue Watch';
        const history = loadWatchHistory(currentUser?.uid);
        if (history.length === 0) {
          bodyEl.innerHTML = `<div class="text-gray-400 text-sm">No episodes watched yet. Start watching any published episode to see it here.</div>`;
        } else {
          bodyEl.innerHTML = history.map(item => {
            const idx = publicEpisodes.findIndex(ep => ep.id === item.id);
            const clickAttr = idx >= 0 ? `onclick="closeSectionModal(); playEpisodeByIndex(${idx});"` : '';
            return `
              <div ${clickAttr} class="flex items-center justify-between gap-3 bg-dark p-3 rounded-xl border border-white/10 ${idx >= 0 ? 'cursor-pointer hover:border-brand-500' : ''}">
                <div class="overflow-hidden">
                  <div class="text-xs text-brand-400 font-bold truncate">${escapeHtml(item.animeTitle)} • ${escapeHtml(item.seasonName)}</div>
                  <div class="text-sm font-bold text-white truncate">Ep ${escapeHtml(String(item.epNumber))}: ${escapeHtml(item.epTitle)}</div>
                </div>
                ${idx >= 0 ? `<span class="text-xs font-bold bg-brand-500 text-white px-3 py-1 rounded-lg shrink-0">Resume</span>` : ''}
              </div>
            `;
          }).join('');
        }
      } else if (section === 'new-release') {
        titleEl.textContent = 'New Release Anime';
        if (publicEpisodes.length === 0) {
          bodyEl.innerHTML = `<div class="text-gray-400 text-sm">No new release episodes published yet.</div>`;
        } else {
          bodyEl.innerHTML = publicEpisodes.slice(0, 8).map((ep, idx) => `
            <div onclick="closeSectionModal(); playEpisodeByIndex(${idx});" class="flex items-center gap-4 bg-dark p-3 rounded-xl border border-white/10 hover:border-brand-500 cursor-pointer">
              <div class="w-24 aspect-video rounded-lg overflow-hidden bg-surface shrink-0 flex items-center justify-center">
                ${ep.thumbnailUrl
                  ? `<img src="${escapeAttr(ep.thumbnailUrl)}" alt="${escapeAttr(ep.epTitle)}" class="w-full h-full object-cover">`
                  : `<span class="text-[11px] text-gray-500">No IMG</span>`}
              </div>
              <div class="overflow-hidden">
                <div class="text-xs text-brand-400 font-bold truncate">${escapeHtml(ep.animeTitle)}</div>
                <div class="text-sm font-bold text-white truncate">Ep ${escapeHtml(String(ep.epNumber))}: ${escapeHtml(ep.epTitle)}</div>
                <div class="text-xs text-gray-400 truncate">${escapeHtml(ep.seasonName)}</div>
              </div>
            </div>
          `).join('');
        }
      }

      modal.classList.remove('hidden');
    };

    window.closeSectionModal = function() {
      document.getElementById('userSectionModal').classList.add('hidden');
    };

    document.getElementById('submitAuthBtn').addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      if (authMode === 'signup' && !username) {
        alert("Please enter your username to create an account.");
        return;
      }

      try {
        let cred;
        if (authMode === 'signup') {
          cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: username });
          await setDoc(doc(db, ...basePublicPath, 'users', cred.user.uid), {
            uid: cred.user.uid,
            username,
            email: cred.user.email,
            createdAt: serverTimestamp()
          }).catch(() => {});
        } else {
          cred = await signInWithEmailAndPassword(auth, email, password);
        }

        const resolvedUsername = authMode === 'signup'
          ? username
          : (cred.user.displayName || cred.user.email.split('@')[0]);

        await addDoc(sessionsRef, {
          uid: cred.user.uid,
          username: resolvedUsername,
          email: cred.user.email,
          action: authMode === 'signup' ? 'account_created' : 'login',
          loggedInAt: serverTimestamp(),
          userAgent: navigator.userAgent || ''
        }).catch(() => {});

        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        closeLoginModal();
      } catch (err) {
        alert((authMode === 'signup' ? "Account creation failed: " : "Login failed: ") + err.message);
      }
    });

    onSnapshot(animesRef, (snapshot) => {
      const episodes = [];

      snapshot.docs.forEach(docSnap => {
        const docData = docSnap.data();
        const visibility = (docData.visibility || 'public').toLowerCase();
        if (visibility !== 'public') return;

        const animeTitle = docData.title || 'Untitled Series';
        const description = docData.description || '';
        const createdMs = docData.uploadedAt?.toMillis
          ? docData.uploadedAt.toMillis()
          : (docData.createdAt?.toMillis ? docData.createdAt.toMillis() : 0);

        const seasons = Array.isArray(docData.seasons) ? docData.seasons : [];
        seasons.forEach(season => {
          const seasonName = season.name || 'Season 1';
          const eps = Array.isArray(season.episodes) ? season.episodes : [];
          eps.forEach(ep => {
            if (!ep || !ep.videoUrl) return;

            const servers = [];
            if (ep.videoUrl) servers.push({ name: 'Server 1 (Primary)', url: ep.videoUrl });
            if (ep.backupUrl) servers.push({ name: 'Server 2 (Backup)', url: ep.backupUrl });
            if (ep.embedUrl) servers.push({ name: 'Server 3 (Embed)', url: ep.embedUrl });

            episodes.push({
              id: `${docSnap.id}_${seasonName}_${ep.episodeNumber || ''}_${ep.title || ''}`,
              animeTitle,
              seasonName,
              epNumber: ep.episodeNumber || '',
              epTitle: ep.title || 'Episode',
              description,
              thumbnailUrl: ep.thumbnailUrl || '',
              servers,
              createdMs
            });
          });
        });
      });

      episodes.sort((a, b) => b.createdMs - a.createdMs);
      publicEpisodes = episodes;

      renderHomeAndGrid();
      renderEpisodeSwitcher();
    });

    function renderHomeAndGrid() {
      const heroTitle = document.getElementById('heroTitle');
      const heroSynopsis = document.getElementById('heroSynopsis');
      const heroBg = document.getElementById('heroBg');
      const heroWatchBtn = document.getElementById('heroWatchBtn');
      const gridContainer = document.getElementById('dynamicGrid');

      if (publicEpisodes.length === 0) {
        heroTitle.textContent = 'Monarch Anime';
        heroSynopsis.textContent = 'No public episodes published yet.';
        heroBg.style.backgroundImage = '';
        heroWatchBtn.classList.add('hidden');
        gridContainer.innerHTML = '<div class="text-gray-500 text-sm col-span-full">No public episodes published yet.</div>';
        return;
      }

      const latest = publicEpisodes[0];
      heroTitle.textContent = latest.animeTitle;
      heroSynopsis.textContent = latest.description || `${latest.seasonName} — Episode ${latest.epNumber}: ${latest.epTitle}`;
      heroBg.style.backgroundImage = latest.thumbnailUrl ? `url("${escapeAttr(latest.thumbnailUrl)}")` : '';
      heroWatchBtn.classList.remove('hidden');

      gridContainer.innerHTML = publicEpisodes.map((ep, idx) => `
        <div class="bg-surface rounded-xl overflow-hidden border border-white/5 hover:border-brand-500/60 transition-colors cursor-pointer flex flex-col" onclick="playEpisodeByIndex(${idx})">
          <div class="w-full aspect-video bg-dark flex items-center justify-center overflow-hidden">
            ${ep.thumbnailUrl
              ? `<img src="${escapeAttr(ep.thumbnailUrl)}" alt="${escapeAttr(ep.epTitle)}" class="w-full h-full object-cover">`
              : `<span class="text-xs text-gray-500">No Thumbnail</span>`}
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs text-brand-400 font-bold truncate">${escapeHtml(ep.animeTitle)}</div>
              <h3 class="text-white font-bold text-sm truncate mt-0.5">Ep ${escapeHtml(String(ep.epNumber))}: ${escapeHtml(ep.epTitle)}</h3>
            </div>
            <div class="text-xs text-gray-400 mt-2 truncate">${escapeHtml(ep.seasonName)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderEpisodeSwitcher() {
      const container = document.getElementById('episodeListContainer');
      if (!container) return;
      if (publicEpisodes.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = publicEpisodes.map((ep, idx) => {
        const isActive = currentEpisodeIndex === idx;
        return `
          <button type="button" onclick="playEpisodeByIndex(${idx})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${isActive ? 'bg-brand-500 text-white' : 'bg-dark text-gray-300 hover:bg-white/10 border border-white/10'}">
            Ep ${escapeHtml(String(ep.epNumber))}: ${escapeHtml(ep.epTitle)}
          </button>
        `;
      }).join('');
    }

    function renderServerButtons() {
      const serverWrap = document.getElementById('serverButtonsList');
      if (!serverWrap || !currentEpisode || !currentEpisode.servers) {
        if (serverWrap) serverWrap.innerHTML = '';
        return;
      }

      serverWrap.innerHTML = currentEpisode.servers.map((s, sIdx) => {
        const isActive = activeServerIndex === sIdx;
        return `
          <button type="button" onclick="switchActiveServer(${sIdx})" class="px-2.5 py-1 rounded text-xs font-semibold transition-colors ${isActive ? 'bg-brand-500 text-white' : 'bg-dark text-gray-400 hover:text-white border border-white/10'}">
            ${escapeHtml(s.name)}
          </button>
        `;
      }).join('');
    }

    window.switchActiveServer = function(serverIdx) {
      if (!currentEpisode || !currentEpisode.servers || !currentEpisode.servers[serverIdx]) return;
      activeServerIndex = serverIdx;
      renderServerButtons();
      mountPlayerSource(currentEpisode.servers[serverIdx].url, currentEpisode.thumbnailUrl);
    };

    function isDirectVideoUrl(url) {
      const clean = (url || '').split('?')[0].toLowerCase();
      return clean.endsWith('.mp4') || clean.endsWith('.webm') || clean.endsWith('.ogg');
    }

    function mountPlayerSource(url, posterUrl) {
      const box = document.getElementById('playerBox');
      if (!box || !url) return;

      if (isDirectVideoUrl(url)) {
        box.innerHTML = `
          <video id="activeMediaVideo" controls autoplay class="w-full h-full object-contain" ${posterUrl ? `poster="${escapeAttr(posterUrl)}"` : ''}>
            <source src="${escapeAttr(url)}" type="video/mp4">
            Your browser does not support HTML5 video.
          </video>
        `;
        const v = document.getElementById('activeMediaVideo');
        v.addEventListener('ended', handleVideoEnded);
      } else {
        box.innerHTML = `
          <iframe id="activeMediaFrame" src="${escapeAttr(url)}" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        `;
      }
    }

    function handleVideoEnded() {
      const autoNext = document.getElementById('autoNextToggle')?.checked;
      if (autoNext && currentEpisodeIndex >= 0 && currentEpisodeIndex < publicEpisodes.length - 1) {
        playEpisodeByIndex(currentEpisodeIndex + 1);
      }
    }

    window.playEpisodeByIndex = function(index) {
      const ep = publicEpisodes[index];
      if (!ep || !ep.servers || ep.servers.length === 0) return;

      currentEpisodeIndex = index;
      currentEpisode = ep;
      activeServerIndex = 0;
      recordEpisodeWatch(ep);

      document.getElementById('watchMeta').textContent = `${ep.animeTitle} • ${ep.seasonName} • Episode ${ep.epNumber}`;
      document.getElementById('watchTitle').textContent = ep.epTitle;
      document.getElementById('watchDesc').textContent = ep.description || 'No description provided.';

      renderServerButtons();
      renderEpisodeSwitcher();
      mountPlayerSource(ep.servers[0].url, ep.thumbnailUrl);
      showWatchView();
    };

    window.watchLatestEpisode = function() {
      if (publicEpisodes.length > 0) {
        playEpisodeByIndex(0);
      }
    };

    window.toggleTheaterMode = function() {
      document.body.classList.toggle('theater-on');
      const isOn = document.body.classList.contains('theater-on');
      document.getElementById('lightIcon').innerHTML = isOn ? '&#9679;' : '&#9680;';
      document.getElementById('lightText').textContent = isOn ? 'Light: On' : 'Light: Off';
    };

    window.showWatchView = function() {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('watchView').classList.remove('hidden');
      window.scrollTo(0, 0);
    };

    window.showHomeView = function() {
      document.getElementById('watchView').classList.add('hidden');
      document.getElementById('homeView').classList.remove('hidden');
      document.body.classList.remove('theater-on');
      const box = document.getElementById('playerBox');
      if (box) box.innerHTML = '';
      window.scrollTo(0, 0);
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
